services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: kalshi-ml:0.2.0
    command: ["kalshi-ml-run", "--mode", "paper"]
    user: "${KALSHI_UID:-10001}:${KALSHI_GID:-10001}"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
    volumes:
      - ../.env:/app/.env:ro
      - ../secrets:/app/secrets:ro
      - ../models:/app/models:ro
      - ../logs:/app/logs:rw
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
