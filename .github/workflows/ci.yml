name: Buyer package verification

on:
  push:
    branches: [main, research/backtest-2025-spot-proxy]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - run: python -m pip install --no-deps .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -q
      - run: python quickstart.py --check
      - run: kalshi-ml-run --help

  package:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python scripts/build_release.py
      - name: Checksum distributions
        run: |
          cd dist
          sha256sum *.whl > wheel.sha256
          sha256sum --check *.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: kalshi-ml-0.2.0
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  docker:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t kalshi-ml:ci .
      - run: docker run --rm --network none --read-only --tmpfs /tmp kalshi-ml:ci kalshi-ml-quickstart --check
      - run: docker run --rm --network none --read-only --tmpfs /tmp kalshi-ml:ci kalshi-ml-run --help

  backtest_2025:
    if: github.ref == 'refs/heads/research/backtest-2025-spot-proxy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --only-binary=:all: -r requirements.txt
      - run: python scripts/backtest_2025.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-2025-spot-proxy
          path: reports/backtest-2025/
          retention-days: 30
