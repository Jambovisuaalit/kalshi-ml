name: 2025 SPOT_PROXY research backtest

on:
  push:
    branches:
      - research/backtest-2025-spot-proxy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Full year 2025 data and SPOT_PROXY backtest
        run: python scripts/backtest_2025.py
      - name: Save test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-2025-results
          path: reports/backtest-2025/
          if-no-files-found: warn
          retention-days: 30
